<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:DubaiX;src:url("file:///C:/Windows/Fonts/DUBAI-BOLD.TTF");font-weight:700}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{background:linear-gradient(170deg,#087F70 0%,#075E54 100%);font-family:"Segoe UI",sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center}
[lang=ar] body,[lang=ar] h1{font-family:DubaiX,"Segoe UI",sans-serif}
.cap{height:360px;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 80px;text-align:center}
h1{margin:0;font-size:78px;line-height:1.12;font-weight:700;letter-spacing:-.5px}
[lang=ar] h1{font-size:84px;line-height:1.3;letter-spacing:0}
.brand{margin-top:22px;font-size:34px;opacity:.85;font-weight:600}
.frame{width:820px;height:1430px;border-radius:56px;background:#0E1A19;padding:18px;box-sizing:border-box;box-shadow:0 30px 60px rgb(0 0 0/.35)}
.screen{width:100%;height:100%;border-radius:40px;overflow:hidden;background:#fff}
.screen img{width:100%;display:block}
</style></head><body>
<div class="cap"><h1 id="t"></h1><div class="brand">ShifaDaily · شفاء يومي</div></div>
<div class="frame"><div class="screen"><img id="i"></div></div>
<script>
const p=new URLSearchParams(location.search);const L=p.get('lang');
document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
document.getElementById('t').textContent=p.get('t');document.getElementById('i').src=p.get('img');
</script></body></html>
