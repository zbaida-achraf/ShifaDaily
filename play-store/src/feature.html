<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dubai;src:local("Dubai"),url("file:///C:/Windows/Fonts/DUBAI-BOLD.TTF");font-weight:700}
@font-face{font-family:Dubai;src:url("file:///C:/Windows/Fonts/DUBAI-REGULAR.TTF");font-weight:400}
html,body{margin:0;width:1024px;height:500px;overflow:hidden}
body{font-family:"Segoe UI",Dubai,sans-serif;background:linear-gradient(120deg,#E8F5F1 0%,#F8FAFC 60%);color:#172B2A;position:relative}
.blob{position:absolute;inset:auto -120px -220px auto;width:620px;height:620px;border-radius:50%;background:#087F70;opacity:.95}
.blob2{position:absolute;right:250px;top:-140px;width:260px;height:260px;border-radius:50%;background:#D6EFE8}
.copy{position:absolute;top:0;bottom:0;left:64px;width:560px;display:flex;flex-direction:column;justify-content:center;gap:14px}
[dir=rtl] .copy{left:auto;right:64px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:76px;height:76px;border-radius:20px;background:#087F70;display:grid;place-items:center;box-shadow:0 8px 20px rgb(8 127 112/.25)}
.logo svg{width:50px;height:50px}
.name{font-size:50px;font-weight:700;letter-spacing:-.5px;line-height:1}
.name small{display:block;font-family:Dubai;font-size:26px;font-weight:700;color:#075E54;margin-top:6px}
h1{margin:6px 0 0;font-size:36px;line-height:1.2;font-weight:700;color:#075E54}
[lang=ar] h1,[lang=ar] .chips{font-family:Dubai}
[lang=ar] h1{font-size:40px;line-height:1.35}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.chips span{background:#fff;border:1px solid #CFE6DF;border-radius:999px;padding:7px 16px;font-size:19px;font-weight:600;color:#075E54}
.phone{position:absolute;right:92px;top:50px;width:222px;height:408px;border-radius:30px;border:7px solid #172B2A;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgb(0 0 0/.25)}
[dir=rtl] .phone{right:auto;left:92px}
[dir=rtl] .blob{inset:auto auto -220px -120px}
[dir=rtl] .blob2{right:auto;left:250px}
.phone img{width:100%;display:block}
</style></head><body>
<div class="blob"></div><div class="blob2"></div>
<div class="copy">
 <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-linejoin="round" stroke-linecap="round"><path stroke-width="1.7" d="M12,21.35l-1.45,-1.32C5.4,15.36 2,12.28 2,8.5 2,5.42 4.42,3 7.5,3c1.74,0 3.41,0.81 4.5,2.09C13.09,3.81 14.76,3 16.5,3 19.58,3 22,5.42 22,8.5c0,3.78 -3.4,6.86 -8.55,11.54L12,21.35z"/><path stroke-width="1.5" d="M5.5,11.5h3.2l1.6,-3 2.4,6 1.6,-3h4.2"/></svg></div>
  <div class="name">ShifaDaily<small>شفاء يومي</small></div></div>
 <h1 id="headline"></h1>
 <div class="chips" id="chips"></div>
</div>
<div class="phone"><img id="shot" alt=""></div>
<script>
const p=new URLSearchParams(location.search);const L=p.get('lang')||'en';
const T={en:{h:'Medication reminders & diabetes-conscious meal ideas',c:['Arabic & English','Works offline','No ads']},
fr:{h:'Rappels de médicaments et idées de repas équilibrées',c:['Arabe & anglais','Hors ligne','Sans pub']},
ar:{h:'تذكير بمواعيد الأدوية وأفكار وجبات تراعي مرضى السكري',c:['العربية والإنجليزية','بدون إنترنت','بدون إعلانات']}}[L];
document.documentElement.lang=L;document.documentElement.dir=L==='ar'?'rtl':'ltr';
document.getElementById('headline').textContent=T.h;
document.getElementById('chips').innerHTML=T.c.map(x=>'<span>'+x+'</span>').join('');
document.getElementById('shot').src=p.get('shot');
</script></body></html>
